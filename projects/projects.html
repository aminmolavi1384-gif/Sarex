<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <title>پروژه‌ها - Sarex Tech</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../index.css">

    <style>
        /* جلوگیری از تداخل #main در index.css با صفحه پروژه‌ها */
        #main.projects-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            height: auto;
            display: block;
            overflow: visible;
            padding: 170px 20px 120px;
            box-sizing: border-box;
            z-index: 1;
        }

        #main.projects-page #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #main-header {
            z-index: 100;
        }

        .projects-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            box-sizing: border-box;
            text-align: center;
        }

        .projects-page .section-title {
            margin: 0 0 12px;
            color: var(--text-main);
            font-size: 2.5rem;
            line-height: 1.5;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }

        .projects-page .section-subtitle {
            margin: 0 0 50px;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 30px;
            width: 100%;
            align-items: stretch;
        }

        .project-card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 460px;
            overflow: hidden;
            background: var(--bg-glass);
            border: 1px solid var(--border-neon);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: right;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-cyan);
            box-shadow: 0 15px 35px rgba(0, 242, 254, 0.2);
        }

        .project-image-holder {
            position: relative;
            width: 100%;
            height: 210px;
            flex-shrink: 0;
            background-color: rgba(10, 20, 47, 0.5);
            background-position: center;
            background-size: cover;
            transition: transform 0.4s ease;
        }

        .project-card:hover .project-image-holder {
            transform: scale(1.03);
        }

        .project-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4, 0, 20, 0.75);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-image-holder:hover .project-overlay {
            opacity: 1;
        }

        .view-project-btn {
            padding: 10px 22px;
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            background: rgba(0, 242, 254, 0.1);
            color: #fff;
            font-family: 'vazir', sans-serif;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            transition: all 0.3s ease;
        }

        .view-project-btn:hover {
            background: var(--neon-cyan);
            color: #040014;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .project-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 22px;
            box-sizing: border-box;
        }

        .project-title {
            margin: 0 0 12px;
            color: var(--text-main);
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .project-desc {
            flex-grow: 1;
            margin: 0 0 22px;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.9;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .project-tags span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 12px;
            border: 1px solid rgba(58, 134, 255, 0.3);
            border-radius: 999px;
            background: rgba(58, 134, 255, 0.1);
            color: var(--neon-blue);
            font-family: 'vazir', sans-serif;
            font-size: 0.78rem;
            line-height: 1.6;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .project-card:hover .project-tags span {
            border-color: var(--neon-cyan);
            background: rgba(0, 242, 254, 0.05);
            color: var(--neon-cyan);
        }

        .status-message {
            grid-column: 1 / -1;
            padding: 40px 20px;
            color: var(--text-muted);
            font-family: 'vazir', sans-serif;
            font-size: 1rem;
        }

        .status-message.error {
            color: #ff3a3a;
            text-shadow: 0 0 10px rgba(255, 58, 58, 0.3);
        }

        @media (max-width: 1000px) {
            #main.projects-page {
                padding-top: 175px;
            }

            .projects-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 768px) {
            #main.projects-page {
                padding-top: 220px;
                padding-bottom: 90px;
            }

            .projects-page .section-title {
                font-size: 1.8rem;
            }

            .projects-page .section-subtitle {
                margin-bottom: 35px;
                font-size: 0.9rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .project-card {
                min-height: 430px;
            }

            .project-image-holder {
                height: 200px;
            }

            .project-title {
                font-size: 1.05rem;
            }

            .project-tags span {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<script>
const menuToggle = document.getElementById('menu-toggle');
const sidebar = document.getElementById('sidebar');
const mainHeader = document.getElementById('main-header');

if (menuToggle && sidebar && mainHeader) {
    menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('open');
        sidebar.classList.toggle('active');
        mainHeader.classList.toggle('menu-open');
    });

    sidebar.querySelectorAll('.sidebar-links a').forEach(link => {
        link.addEventListener('click', () => {
            menuToggle.classList.remove('open');
            sidebar.classList.remove('active');
            mainHeader.classList.remove('menu-open');
        });
    });
}

const canvas = document.getElementById('matrix-canvas');

if (canvas) {
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = "01XØΔ79Z52W81010101";
    const fontSize = 15;
    let columns = canvas.width / fontSize;
    let drops = [];

    function initDrops() {
        columns = canvas.width / fontSize;
        drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }
    }

    initDrops();
    window.addEventListener('resize', initDrops);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(4, 0, 20, 0.06)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00f2fe';
        ctx.font = `${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(
                Math.floor(Math.random() * chars.length)
            );

            ctx.fillText(
                text,
                i * fontSize,
                drops[i] * fontSize
            );

            if (
                drops[i] * fontSize > canvas.height &&
                Math.random() > 0.975
            ) {
                drops[i] = 0;
            }

            drops[i]++;
        }
    }

    let lastTime = 0;
    const fps = 30;
    const nextFrame = 1000 / fps;

    function updateMatrix(timestamp) {
        if (!lastTime) {
            lastTime = timestamp;
        }

        const elapsed = timestamp - lastTime;

        if (elapsed > nextFrame) {
            drawMatrix();
            lastTime = timestamp - (elapsed % nextFrame);
        }

        requestAnimationFrame(updateMatrix);
    }

    requestAnimationFrame(updateMatrix);
}

function getLocalProjects() {
    try {
        const savedProjects = localStorage.getItem('sarex_projects');

        if (!savedProjects) {
            return null;
        }

        const projects = JSON.parse(savedProjects);

        if (!Array.isArray(projects) || projects.length === 0) {
            return null;
        }

        return projects;
    } catch (error) {
        console.error('Error reading projects from LocalStorage:', error);
        return null;
    }
}


function renderProjects(projects) {
    const wrapper = document.getElementById('projects-wrapper');

    if (!wrapper) {
        return;
    }

    wrapper.innerHTML = '';

    projects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'project-card';

        let tagsHTML = '';

        if (Array.isArray(project.tags) && project.tags.length > 0) {
            tagsHTML = project.tags
                .map(tag => `<span>${tag}</span>`)
                .join('');
        } else if (project.category) {
            tagsHTML = `<span>${project.category}</span>`;
        } else {
            tagsHTML = '<span>Sarex Tech</span>';
        }

        const finalImageUrl =
            project.image || 'images/default-project.jpg';

        card.innerHTML = `
            <div
                class="project-image-holder"
                style="background-image: url('${finalImageUrl}');"
            >
                <div class="project-overlay">
                    <a
                        href="${project.demoUrl || '#'}"
                        class="view-project-btn"
                        target="_blank"
                    >
                        مشاهده دمو
                    </a>
                </div>
            </div>

            <div class="project-info">
                <h3 class="project-title">
                    ${project.title || 'بدون عنوان'}
                </h3>

                <p class="project-desc">
                    ${project.desc || 'بدون توضیحات تکمیلی.'}
                </p>

                <div class="project-tags">
                    ${tagsHTML}
                </div>
            </div>
        `;

        wrapper.appendChild(card);
    });
}


function fetchAndRenderProjects() {
    const localProjects = getLocalProjects();

    if (localProjects) {
        renderProjects(localProjects);
        return;
    }

    const fallbackProjects = getFallbackProjects();
    renderProjects(fallbackProjects);
}

fetchAndRenderProjects();
